name: log-ingester

services:
  app:
    build: .
    environment: &app-env
      LISTEN_ADDR: 0.0.0.0:8080
      CLICKHOUSE_URL: http://clickhouse:8123/
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: log_ingester
      CLICKHOUSE_PASSWORD: exercise-only
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v1/logs?limit=1"]
      interval: 2s
      timeout: 3s
      retries: 20
  go:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["go"]
    command: ["help"]
    environment: *app-env
    volumes:
      - .:/usr/src/app
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.42.13
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: log_ingester
      CLICKHOUSE_PASSWORD: exercise-only
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "log_ingester", "--password", "exercise-only", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gomod:
  gobuild:
