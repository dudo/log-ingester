name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite == 'durability' && 'Acknowledgment durability' || 'Service tests' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [service, durability]
        event: ["${{ github.event_name }}"]
        exclude:
          - suite: durability
            event: push
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - if: matrix.suite == 'service'
        run: go vet ./...
      - if: matrix.suite == 'service'
        run: go test -race ./...
      - run: docker compose up -d --wait --wait-timeout 60
      - if: matrix.suite == 'service'
        run: go test -race -tags integration ./...
      - if: matrix.suite == 'durability'
        run: go test -race -tags durability -run '^TestAcknowledgedLogsSurviveInsertFailure
      - if: always()
        run: docker compose down --volumes
 -count=1 ./internal/clickhouse
      - if: always()
        run: docker compose down --volumes
