name: log-ingester

services:
  go: &go
    profiles: [tools]
    build:
      context: .
      target: base
    entrypoint: ["go"]
    command: ["help"]
    env_file: .env
    volumes:
      - .:/usr/src/app
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
  app:
    <<: *go
    profiles: []
    command: ["run", "./cmd/log-ingester"]
    init: true
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v1/logs?limit=1"]
      interval: 2s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.42.13
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: log_ingester
      CLICKHOUSE_PASSWORD: exercise-only
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "log_ingester", "--password", "exercise-only", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gomod:
  gobuild:
